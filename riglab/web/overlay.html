<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RigLab Overlay</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;font:600 calc(13px * var(--k,1)) "Cascadia Mono",Consolas,monospace;color:#e8ebf2}
#b{display:inline-block;padding:calc(8px * var(--k,1)) calc(12px * var(--k,1));border-radius:calc(10px * var(--k,1));
  background:rgba(8,10,15,var(--a,.82));border:1px solid rgba(255,255,255,calc(var(--a,.82) * .1));white-space:nowrap}
body.clear #b{text-shadow:0 1px 2px #000,0 0 4px #000}           /* no background: keep text readable */
.grid{display:grid;grid-template-columns:auto auto auto auto;gap:3px 12px}
.k{color:#8b94a8;font-weight:500}
.app{grid-column:1/-1;color:#8b94a8;font-weight:500;font-size:.85em;overflow:hidden;text-overflow:ellipsis;max-width:270px}
.big{font-size:2em;line-height:1;font-weight:700}
.big small{font-size:.42em;font-weight:600;color:#8b94a8;margin-left:4px}
.sub{color:#b8c0d0;font-size:.95em;margin-top:3px}
.sub span{margin-right:10px}
canvas{display:block;margin-top:5px}
#b.edit{outline:2px dashed #36d6ff;outline-offset:-3px;cursor:move}
.editbar{display:flex;align-items:center;gap:10px;margin-top:6px;font:600 12px "Segoe UI",sans-serif;color:#36d6ff}
.editbar button{font:700 12px "Segoe UI",sans-serif;padding:4px 12px;border-radius:6px;border:0;background:#36d6ff;color:#061018;cursor:pointer}
</style></head>
<body><div id="b" class="pywebview-drag-region">RigLab</div>
<script>
const el = document.getElementById("b");
const col = t => t == null ? "#e8ebf2" : t >= 85 ? "#ff5c6c" : t >= 72 ? "#ffc046" : "#3ee08f";
const v = (x, u) => x == null ? "—" : Math.round(x) + u;
const esc = s => String(s || "").replace(/[<>&"]/g, "");
let cfg = { mode: "full" }, hist = [], lastFit = "";

function fpsColour(f) {
  if (cfg.fps_color === "white") return "#ffffff";
  if (cfg.fps_color === "accent") return "#36d6ff";
  return f == null ? "#e8ebf2" : f >= 60 ? "#3ee08f" : f >= 30 ? "#ffc046" : "#ff5c6c";
}

// full stats: CPU/GPU/RAM grid (+ FPS row)
function fpsRow(r) {
  // off / no game in front: no row (no stale numbers). unavailable: "—", never an error
  if (!r || r.state === "off" || r.state === "no_game") return "";
  if (r.state !== "ok") return `<span class="k">FPS</span><span>—</span><span></span><span></span>`;
  return `<span class="k">FPS</span><span style="color:${fpsColour(r.fps)}">${Math.round(r.fps)}</span>` +
    `<span>1% ${r.low1 == null ? "—" : Math.round(r.low1)}</span><span>${r.frametime == null ? "—" : r.frametime.toFixed(1)}ms</span>` +
    (r.app ? `<span class="app">${esc(r.app)}</span>` : "");
}
function full(s, r) {
  return `<div class="grid">` + (cfg.show_fps ? fpsRow(r) : "") +
    `<span class="k">CPU</span><span>${v(s.cpu_load, "%")}</span><span style="color:${col(s.cpu_temp)}">${v(s.cpu_temp, "°C")}</span><span>${v(s.cpu_power, "W")}</span>` +
    `<span class="k">GPU</span><span>${v(s.gpu_load, "%")}</span><span style="color:${col(s.gpu_temp)}">${v(s.gpu_temp, "°C")}</span><span>${v(s.gpu_power, "W")}</span>` +
    `<span class="k">RAM</span><span>${v(s.ram_load, "%")}</span><span></span><span></span></div>`;
}

// FPS counter styles
function counter(r) {
  const ok = r && r.state === "ok", f = ok ? Math.round(r.fps) : null;
  const num = `<div class="big" style="color:${fpsColour(f)}">${f == null ? "—" : f}<small>FPS</small></div>`;
  const low = `<span>1% ${ok && r.low1 != null ? Math.round(r.low1) : "—"}</span>`;
  const ft = `<span>${ok && r.frametime != null ? r.frametime.toFixed(1) : "—"} ms</span>`;
  switch (cfg.mode) {
    case "fps_low": return num + `<div class="sub">${low}</div>`;
    case "fps_time": return num + `<div class="sub">${ft}</div>`;
    case "fps_detail": return num + `<div class="sub">${low}${ft}</div>` + (ok && r.app ? `<div class="sub" style="color:#8b94a8">${esc(r.app)}</div>` : "");
    case "fps_graph": return num + `<canvas id="g" width="200" height="34" style="width:calc(200px * var(--k,1));height:calc(34px * var(--k,1))"></canvas>`;
    default: return num;
  }
}
function drawGraph() {
  const cv = document.getElementById("g");
  if (!cv) return;
  const x = cv.getContext("2d"), W = cv.width, H = cv.height;
  x.clearRect(0, 0, W, H);
  const pts = hist.filter(p => p != null);
  if (pts.length < 2) return;
  const hi = Math.max(...pts) * 1.25, lo = 0;
  x.strokeStyle = "rgba(255,255,255,.12)"; x.beginPath(); x.moveTo(0, H - 0.5); x.lineTo(W, H - 0.5); x.stroke();
  x.strokeStyle = fpsColour(hist.length ? 1000 / (hist[hist.length - 1] || 1000) : null); x.lineWidth = 1.6; x.beginPath();
  hist.forEach((p, i) => { if (p == null) return; const px = i / (hist.length - 1) * W, py = H - 2 - (p - lo) / (hi - lo) * (H - 4); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}

function fit() {
  const r = el.getBoundingClientRect(), key = Math.ceil(r.width) + "x" + Math.ceil(r.height);
  if (key !== lastFit) { lastFit = key; try { pywebview.api.overlay_fit(Math.ceil(r.width) + 4, Math.ceil(r.height) + 4); } catch (e) {} }
}

async function tick() {
  let next = 1000;
  try {
    cfg = await pywebview.api.overlay_config();
    document.documentElement.style.setProperty("--k", { s: .85, m: 1, l: 1.3, xl: 1.7 }[cfg.size] || 1);
    document.documentElement.style.setProperty("--a", cfg.opacity);
    document.body.classList.toggle("clear", cfg.opacity < .25);
    const counterMode = cfg.mode !== "full";
    let r = null;
    if (counterMode || cfg.show_fps) { try { r = await pywebview.api.overlay_fps(); } catch (e) { r = null; } }
    let html;
    if (counterMode) {
      if (cfg.mode === "fps_graph") { hist.push(r && r.state === "ok" ? r.frametime : null); if (hist.length > 60) hist.shift(); next = 250; }
      html = counter(r);
      // nothing in front rendering: keep the box's size but show nothing (unless it's being moved)
      el.style.visibility = (r && r.state === "no_game" && !cfg.edit) ? "hidden" : "visible";
    } else {
      el.style.visibility = "visible";
      html = full((await pywebview.api.snapshot()).summary, r);
    }
    if (cfg.edit) html += `<div class="editbar"><span>Drag me anywhere</span><button id="done">Done</button></div>`;
    el.innerHTML = html;
    el.classList.toggle("edit", !!cfg.edit);
    const done = document.getElementById("done");
    if (done) { done.classList.add("pywebview-drag-region-exclude"); done.onmousedown = e => e.stopPropagation(); done.onclick = () => pywebview.api.overlay_edit(false); }
    drawGraph();
    fit();
  } catch (e) {}
  setTimeout(tick, next);
}
window.addEventListener("pywebviewready", tick);
</script></body></html>

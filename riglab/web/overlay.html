<!DOCTYPE html>
<html data-theme="dark"><head><meta charset="utf-8"><title>RigLab Overlay</title>
<link rel="stylesheet" href="app.css">
<style>
/* The overlay window: tiny, transparent, always on top. Colours follow the app theme (app.css variables). */
html,body{margin:0!important;background:transparent!important;overflow:hidden;height:auto!important}
body{font:600 calc(13px * var(--k,1)) "Cascadia Mono",Consolas,monospace;color:var(--ov-text,var(--text));user-select:none}
#w{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;width:max-content}
#b{display:inline-flex;width:max-content;gap:calc(14px * var(--k,1));align-items:center;padding:calc(6px * var(--k,1)) calc(12px * var(--k,1));
  border-radius:calc(10px * var(--k,1));background:color-mix(in srgb, var(--panel) calc(var(--a,.85) * 100%), transparent);
  border:1px solid color-mix(in srgb, var(--line) calc(var(--a,.85) * 100%), transparent);white-space:nowrap}
#b.vert{flex-direction:column;align-items:stretch;gap:calc(2px * var(--k,1))}
body.clear #b{text-shadow:0 1px 2px #000,0 0 4px #000}            /* no background: keep the text readable over any game */
.ovs{display:flex;align-items:baseline;gap:calc(5px * var(--k,1))}
.ovs .v{font-size:1.25em;font-weight:750}
.ovs .u{font-size:.75em;opacity:.8}
.ovs .k{color:var(--ov-muted,var(--muted));font-weight:600;font-size:.78em;letter-spacing:.02em}
#b.vert .ovs{justify-content:space-between;gap:calc(16px * var(--k,1))}
#b.vert .ovs .k{order:-1}
#b.hor .ovs.fps .v{font-size:1.7em}
#b.editing{outline:2px dashed var(--accent);outline-offset:-2px;cursor:move}
#b.idle .v{opacity:.45}
#bar{display:flex;gap:6px;align-items:center;font:600 11px "Segoe UI",sans-serif;color:var(--accent);
  background:color-mix(in srgb, var(--panel) 95%, transparent);padding:3px 6px;border-radius:7px;border:1px solid var(--accent);cursor:move}
#bar .grip{letter-spacing:-2px;font-size:14px;line-height:1;margin-right:2px}
#bar button{font:700 11px "Segoe UI",sans-serif;padding:3px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);cursor:pointer}
#bar button:hover{border-color:var(--accent)}
#dot{width:20px;height:20px;margin:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 8px var(--accent);cursor:pointer;display:block}
canvas{display:block}
/* preview mode only: a pretend game screen to drag the overlay around on */
body.demo{height:100vh!important;background:linear-gradient(135deg,#2b4a3a,#4a3a2b 40%,#23324f)!important}
body.demo #w{position:absolute;z-index:3}
body.demo #note{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);pointer-events:none;z-index:1;font:500 14px "Segoe UI",sans-serif;color:#fff;opacity:.75;text-align:center;line-height:1.6}
body.demo.ct #w{pointer-events:none}                         /* click-through: the pretend game gets the click */
body.demo #game{position:fixed;z-index:0;background:#1b2733;border:1px solid #57708a;display:flex;align-items:center;justify-content:center;
  font:600 15px "Segoe UI",sans-serif;color:#cfe3f7;cursor:crosshair}
body.demo #game.windowed{left:12%;top:10%;width:62%;height:62%;border-top:28px solid #2d3d4f}
body.demo #game.borderless{inset:0;border:0;background:linear-gradient(135deg,#1d3a2a,#3a2a1d 40%,#1a2846)}
body.demo #game.exclusive{inset:0;border:0;background:#0d0d0d}
body.demo #modes{position:fixed;z-index:2;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;font:600 12px "Segoe UI",sans-serif}
body.demo #modes button{padding:6px 12px;border-radius:8px;border:1px solid #556;background:#223;color:#fff;cursor:pointer}
body.demo #modes button.on{background:#2a6;border-color:#4c8}
</style></head>
<body><div id="w"></div>
<script src="js/explain_data.js"></script>
<script>
const W = document.getElementById("w");
let DEMO = false;
let api = null, cfg = null, hist = [], lastFit = "", busy = false;
const NAMES = { fps: "FPS", low1: "1% LOW", frametime: "FRAME", cpu_temp: "CPU", gpu_temp: "GPU", cpu_load: "CPU USE", gpu_load: "GPU USE", ram: "RAM", cpu_clock: "CPU CLK", gpu_clock: "GPU CLK" };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const tempState = (t) => t == null ? "" : t >= 85 ? "bad" : t >= 75 ? "warn" : "good";
const fpsState = (f) => f == null ? "" : f >= 60 ? "good" : f >= 30 ? "warn" : "bad";
const colour = (st) => (!cfg || cfg.fps_color === "plain" || cfg.fps_color === "white" || !st) ? "" : `color:var(--${st})`;
const r0 = (x) => x == null ? "—" : Math.round(x);

function stat(key, d) {
  const f = d.fps && d.fps.state === "ok" ? d.fps : null;
  let v = "—", u = "", st = "";
  switch (key) {
    case "fps": v = f ? Math.round(f.fps) : "—"; st = fpsState(f && f.fps); break;
    case "low1": v = f && f.low1 != null ? Math.round(f.low1) : "—"; st = fpsState(f && f.low1); break;
    case "frametime": v = f && f.frametime != null ? f.frametime.toFixed(1) : "—"; u = "ms"; break;
    case "cpu_temp": case "gpu_temp": v = r0(d[key]); u = "°C"; st = tempState(d[key]); break;
    case "cpu_load": case "gpu_load": case "ram": v = r0(d[key]); u = "%"; break;
    case "cpu_clock": v = d.cpu_clock == null ? "—" : (d.cpu_clock / 1000).toFixed(2); u = "GHz"; break;
    case "gpu_clock": v = r0(d.gpu_clock); u = "MHz"; break;
  }
  return `<div class="ovs ${key === "fps" ? "fps" : ""}"><span class="v" style="${colour(st)}">${v}</span><span class="u">${u}</span><span class="k">${NAMES[key]}</span></div>`;
}

function drawGraph() {
  const cv = document.getElementById("g");
  if (!cv) return;
  const x = cv.getContext("2d"), Wd = cv.width, H = cv.height;
  x.clearRect(0, 0, Wd, H);
  const pts = hist.filter(p => p != null);
  if (pts.length < 2) return;
  const hi = Math.max(...pts) * 1.25;
  x.strokeStyle = css("--line"); x.beginPath(); x.moveTo(0, H - 0.5); x.lineTo(Wd, H - 0.5); x.stroke();
  x.strokeStyle = css("--accent"); x.lineWidth = 1.6; x.beginPath();
  hist.forEach((p, i) => { if (p == null) return; const px = i / (hist.length - 1) * Wd, py = H - 2 - p / hi * (H - 4); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}

function fit() {
  const r = W.getBoundingClientRect(), key = Math.ceil(r.width) + "x" + Math.ceil(r.height) + "@" + devicePixelRatio;
  if (key !== lastFit) { lastFit = key; try { api.overlay_fit(Math.ceil(r.width), Math.ceil(r.height), devicePixelRatio); } catch (e) {} }
}

function applyLook() {
  const d = document.documentElement;
  d.dataset.theme = cfg.theme === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : (cfg.theme || "dark");
  d.style.setProperty("--k", { s: .85, m: 1, l: 1.3, xl: 1.7 }[cfg.size] || 1);
  d.style.setProperty("--a", cfg.opacity);
  if (cfg.text_color === "white") { d.style.setProperty("--ov-text", "#ffffff"); d.style.setProperty("--ov-muted", "#d6dbe4"); }
  else if (/^#[0-9a-f]{6}$/i.test(cfg.text_color || "")) { d.style.setProperty("--ov-text", cfg.text_color); d.style.setProperty("--ov-muted", cfg.text_color); }
  else { d.style.removeProperty("--ov-text"); d.style.removeProperty("--ov-muted"); }
  document.body.classList.toggle("clear", cfg.opacity < .25);
}

function render(d) {
  if (cfg.visible === false) { W.innerHTML = ""; return; }     // hidden with the hotkey, or an exclusive-fullscreen game
  if (cfg.minimised) {
    W.innerHTML = `<span id="dot" role="button" title="RigLab overlay - click to show it again" aria-label="Show the overlay"></span>`;
    document.getElementById("dot").onclick = async () => { await api.overlay_minimise(false); tick(true); };
    return;
  }
  const stats = cfg.stats || ["fps"];
  const onlyFps = stats.every(s => ["fps", "low1", "frametime", "graph"].includes(s));
  const noGame = d.fps && d.fps.state === "no_game";
  let html = stats.filter(s => s !== "graph").map(s => stat(s, d)).join("");
  if (stats.includes("graph")) html += `<canvas id="g" width="160" height="30" style="width:calc(160px * var(--k,1));height:calc(30px * var(--k,1))"></canvas>`;
  // The counter has no buttons in normal use - clicks go straight through to your game. Only while editing its
  // position does it show an outline, a drag handle, "–" (shrink to a dot) and "Done".
  const editing = !!cfg.editing;
  const idle = onlyFps && noGame;          // nothing is drawing frames: show dim dashes (3.10 hid itself here)
  W.innerHTML = (editing ? `<div id="bar" class="pywebview-drag-region" title="Drag to move"><span class="grip">⠿⠿</span><span>Drag to move</span>` +
      `<button id="min" title="Shrink to a small dot">–</button><button id="done" title="Lock it in place">Done</button></div>` : "") +
    `<div id="b" class="${cfg.layout === "vertical" ? "vert" : "hor"}${editing ? " editing pywebview-drag-region" : ""}${idle ? " idle" : ""}">${html}</div>`;
  W.style.visibility = "visible";
  document.body.classList.toggle("ct", !editing);
  if (editing) {
    for (const id of ["min", "done"]) { const b = document.getElementById(id); b.onmousedown = e => e.stopPropagation(); b.onpointerdown = e => e.stopPropagation(); }
    document.getElementById("min").onclick = async () => { await api.overlay_minimise(true); tick(true); };
    document.getElementById("done").onclick = async () => { await api.overlay_edit(false); tick(true); };
  }
  drawGraph();
}

let busySince = 0;
async function tick(once) {
  if (busy && Date.now() - busySince < 5000) {           // a call that never answers can't freeze the overlay for good
    if (once !== true) setTimeout(tick, 250);            // keep the regular loop alive (a button press may be mid-update)
    return;
  }
  busy = true; busySince = Date.now();
  let next = 1000;
  try {
    cfg = await api.overlay_config();
    applyLook();
    const d = cfg.minimised ? {} : await api.overlay_data();
    if ((cfg.stats || []).includes("graph")) { hist.push(d.fps && d.fps.state === "ok" ? d.fps.frametime : null); if (hist.length > 60) hist.shift(); }
    if ((cfg.stats || []).some(s => ["fps", "low1", "frametime", "graph"].includes(s))) next = 500;
    render(d);
    if (DEMO) placeDemo(); else fit();
  } catch (e) {
    console.error(e);
    try { api && api.overlay_log && api.overlay_log(String(e && e.stack || e)); } catch (x) {}
  }
  busy = false;
  if (once !== true) setTimeout(tick, next);
}

// ---------------------------------------------------------------- preview mode (opened in a normal browser)
function placeDemo() {
  const p = api.demoPos(W.offsetWidth, W.offsetHeight, innerWidth, innerHeight);
  W.style.left = p.x + "px"; W.style.top = p.y + "px";
}
function demoDrag() {
  let start = null;
  W.addEventListener("pointerdown", (e) => {
    if (!cfg || !cfg.editing || cfg.minimised || e.target.closest("button")) return;
    start = { x: e.clientX - W.offsetLeft, y: e.clientY - W.offsetTop };
    W.setPointerCapture(e.pointerId);
  });
  W.addEventListener("pointermove", (e) => { if (start) { W.style.left = (e.clientX - start.x) + "px"; W.style.top = (e.clientY - start.y) + "px"; } });
  W.addEventListener("pointerup", () => {
    if (!start) return;
    start = null;
    api.demoDrop(W.offsetLeft, W.offsetTop, W.offsetWidth, W.offsetHeight, innerWidth, innerHeight);
    placeDemo();
  });
}

function startDemo() {
  DEMO = true;
  const s = document.createElement("script");
  s.src = "js/demo.js";
  s.onload = () => {
    api = new DemoOverlayApi();
    document.body.classList.add("demo");
    document.body.insertAdjacentHTML("beforeend", `<div id="game"></div><div id="note">Preview mode: a pretend game. Hold Ctrl+Alt (or use Edit position in RigLab's Settings) to move the overlay.</div>
      <div id="modes"><button data-m="windowed">Windowed game</button><button data-m="borderless">Borderless fullscreen</button><button data-m="exclusive">Exclusive fullscreen</button></div>`);
    const game = document.getElementById("game"); let clicks = 0;
    game.onclick = () => { clicks++; game.dataset.clicks = clicks; game.textContent = `Game window - clicked ${clicks} time${clicks === 1 ? "" : "s"}`; };
    const setMode = (m) => { api.setGameMode(m); game.className = m; game.textContent = m === "exclusive" ? "Exclusive fullscreen game (overlay can't draw here)" : `Game window (${m})`;
      document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.m === m)); tick(true); };
    document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
    setMode(api.gameMode());
    const hold = (e) => {
      api.setHolding(e.ctrlKey && e.altKey);
      if (e.type === "keydown" && cfg && cfg.hotkey && !["Control", "Shift", "Alt"].includes(e.key)) {
        const combo = [e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", e.key.length === 1 ? e.key.toUpperCase() : e.key].filter(Boolean).join("+");
        if (combo.toLowerCase() === cfg.hotkey.toLowerCase()) { api.toggleHidden(); tick(true); }
      }
    };
    addEventListener("keydown", hold); addEventListener("keyup", hold); addEventListener("blur", () => api.setHolding(false));
    demoDrag();
    tick();
  };
  document.body.append(s);
}
// pywebview adds its API a moment after the page loads; in a normal browser it never comes, so use preview mode
let started = false;
window.addEventListener("pywebviewready", () => { if (started) return; started = true; api = pywebview.api; tick(); });
window.addEventListener("load", () => setTimeout(() => { if (!started && !window.pywebview) { started = true; startDemo(); } }, 700));
</script></body></html>

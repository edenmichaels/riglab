<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RigLab</title>
<link rel="stylesheet" href="app.css">
<script>
/* apply the saved theme before anything is drawn (no flash of the wrong theme) */
try { const t = JSON.parse(localStorage.getItem("riglab.theme") || "{}"); const m = t.theme === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : (t.theme || "dark");
  document.documentElement.dataset.theme = m; document.documentElement.dataset.accent = t.accent || "cyan"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
</head>
<body>
<script src="js/ui.js"></script>
<script src="js/explain_data.js"></script>
<script src="js/simple.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
<script src="js/pages_home.js"></script>
<script src="js/pages_monitor.js"></script>
<script src="js/pages_tests.js"></script>
<script src="js/fx.js"></script>
<script src="js/pages_lighting.js"></script>
<script src="js/ledmap.js"></script>
<script src="js/pages_cooling.js"></script>
<script src="js/pages_system.js"></script>
<script src="js/pages_gputune.js"></script>
<script src="js/pages_oc.js"></script>
<script src="js/pages_crash.js"></script>
<script src="js/pages_history.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Syntax check
        run: python -m compileall -q main.py riglab installer
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        shell: bash
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi

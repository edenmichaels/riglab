name: Release

# Push a tag like v3.6.2 (matching APP_VERSION in riglab/core/config.py) to build the
# installer and publish it as a draft GitHub Release. Can also be run by hand to test the build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: "true"
      PYTHONUTF8: "1"
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(sed -nE 's/^APP_VERSION\s*=\s*"([^"]+)".*/\1/p' riglab/core/config.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $v"; exit 1
          fi

      - name: Install build packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: python installer/build.py

      # Code signing: runs only once a certificate is added as repository secrets
      # (WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD). Unsigned builds still work.
      - name: Sign installer
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem Installer\RigLab-Setup-*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx

      - name: Checksum
        shell: pwsh
        run: |
          $f = Get-ChildItem Installer\RigLab-Setup-*.exe
          "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)" | Out-File -Encoding ascii "Installer\$($f.Name).sha256"

      - name: Collect build log
        if: always()
        shell: pwsh
        run: Copy-Item "$env:LOCALAPPDATA\RigLab-build\build.log" build.log -ErrorAction SilentlyContinue

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RigLab-Setup-${{ steps.ver.outputs.version }}
          path: Installer/RigLab-Setup-*

      - name: Publish draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" Installer/RigLab-Setup-* --draft --generate-notes --title "RigLab ${{ steps.ver.outputs.version }}"
